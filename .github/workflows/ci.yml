name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (fmt, clippy, test on lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install Mesa software Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: TEMPORARY regenerate reference images
        run: cargo test --locked -p copperframe_runtime --test scene_resources example_room_matches_reference_images
        env:
          COPPERFRAME_REQUIRE_GPU: "1"
          COPPERFRAME_UPDATE_GOLDEN: "1"
      - name: TEMPORARY upload reference images
        uses: actions/upload-artifact@v4
        with:
          name: golden
          path: crates/copperframe_runtime/tests/golden/
      - name: Test (GPU tests required on lavapipe)
        run: cargo test --workspace --locked
        env:
          COPPERFRAME_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
      - name: Benchmark the example room (debug build, smoke run)
        run: cargo run -p lever_room --locked -- --bench --frames 30 --bench-size 640x480
        env:
          WGPU_BACKEND: vulkan

  windows:
    name: Windows (clippy, test, release build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The offscreen GPU test runs if the runner exposes an adapter (e.g. WARP)
      # and prints SKIPPED otherwise. A skip is not a render pass.
      - run: cargo test --workspace --locked -- --nocapture
      - run: cargo build --workspace --release --locked
