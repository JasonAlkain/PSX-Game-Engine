[workspace]
resolver = "3"
members = [
    "crates/copperframe_core",
    "crates/copperframe_scene",
    "crates/copperframe_assets",
    "crates/copperframe_render",
    "crates/copperframe_runtime",
    "crates/copperframe_editor",
    "crates/copperframe_game",
    "apps/copperframe_sandbox",
    "apps/copperframe_cli",
    "apps/copperframe_player",
    "examples/room/game",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/JasonAlkain/PSX-Game-Engine"

[workspace.dependencies]
copperframe_core = { path = "crates/copperframe_core" }
copperframe_render = { path = "crates/copperframe_render" }
copperframe_runtime = { path = "crates/copperframe_runtime" }
copperframe_scene = { path = "crates/copperframe_scene" }
copperframe_assets = { path = "crates/copperframe_assets" }
copperframe_editor = { path = "crates/copperframe_editor" }
copperframe_game = { path = "crates/copperframe_game" }

# Graphics / windowing. egui 0.37 (added in Milestone 3) requires wgpu 30 and winit 0.30.
wgpu = "30.0.1"
naga = { version = "30.0.0", features = ["wgsl-in"] }
winit = "0.30.13"
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
# Dockable editor panels. egui_dock has no release for egui 0.37 yet.
egui_tiles = { version = "0.18.0", features = ["serde"] }

# Project data: style settings (Milestone 2), scenes, project and asset metadata (Milestone 3)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["v4", "serde"] }

# Asset import (Milestone 3): static glTF/GLB and PNG/JPEG textures.
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names", "KHR_materials_unlit"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"

# Canonical paths without the Windows verbatim prefix (cargo rejects it in manifests).
dunce = "1.0"

# Gameplay runtime (Milestone 4). rapier3d uses glam 0.33 internally (via
# glamx); conversions happen in copperframe_game::physics only.
hecs = "0.11.2"
rapier3d = "0.36.1"
kira = { version = "0.12.6", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis"] }
directories = "6.0"

# Native folder and file pickers in the editor (Windows: system dialogs;
# Linux: the desktop portal, no GTK needed).
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Command-line interface
clap = { version = "4.6", features = ["derive"] }

# Diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Keep file and line numbers for crash report backtraces (on Windows they go
# into the .pdb next to each .exe, which the itch.io bundle ships).
[profile.release]
debug = "line-tables-only"
